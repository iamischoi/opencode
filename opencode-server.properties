# OpenCode Internal Server Configuration
# ----------------------------------------------------
# 구동 환경에서 외부(opencode.ai) 서버 호출 없이 오직 지정된 
# 사내(Internal) AI 모델과 연동하기 위한 설정파일입니다.

# 1. 커스텀 엔드포인트 활성화 여부 (true / false)
# true로 설정하면 아래 커스텀 공급자들을 사용합니다.
OPENCODE_USE_CUSTOM_PROVIDERS=true

# 2. 다중 커스텀 엔드포인트 설정 (Multi-Endpoint)
# 서로 다른 여러 개의 LLM 서버(공급자)를 등록할 때 사용합니다.
# 모두 API Key 발급/가입이 필요합니다.
# - openrouter: 가입 + Key 필요, 공식 Free 모델 다수
# - groq: 가입 + Key 필요, Free 플랜
# - gemini: Google AI Studio 가입 + Key 필요, 일부 모델 Free Tier
# - cerebras: 가입 + Key 필요, Free Tier
# - sambanova: 가입 + Key 필요, Free Tier + 가입 크레딧
# - zai: 가입 + Key 필요, Flash 계열 Free
# - novita: 가입 + Key 필요, 일부 무료 모델
# - cloudflare: 가입 + API Token + account_id 필요 (선택)
OPENCODE_CUSTOM_PROVIDERS=openrouter,groq,gemini,cerebras,sambanova,zai,novita,cloudflare

# ----------------------------------------------------
# 활성화 추천 순서
# 1) 가장 먼저 OPENROUTER Key만 넣어도 기본 에이전트 구동 가능
# 2) 이후 GROQ / GEMINI / CEREBRAS / SAMBANOVA / ZAI / NOVITA 추가
# 3) CLOUDFLARE 는 account_id 가 필요하므로 마지막에 설정 권장

# [openrouter] 가입 + Key 필요 / 공식 Free 모델 다수 / OpenAI-compatible
OPENCODE_PROVIDER_OPENROUTER_URL=https://openrouter.ai/api/v1
OPENCODE_PROVIDER_OPENROUTER_KEY=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
OPENCODE_PROVIDER_OPENROUTER_MODELS=minimax/minimax-m2.5:free,google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,tencent/hy3-preview:free,inclusionai/ling-2.6-1t:free,nvidia/nemotron-3-super-120b-a12b:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,openai/gpt-oss-120b:free,qwen/qwen3-coder:free

# [groq] 가입 + Key 필요 / Free 플랜 / OpenAI-compatible
OPENCODE_PROVIDER_GROQ_URL=https://api.groq.com/openai/v1
OPENCODE_PROVIDER_GROQ_KEY=발급받은_GROQ_API_KEY
OPENCODE_PROVIDER_GROQ_MODELS=openai/gpt-oss-20b,openai/gpt-oss-120b,llama-3.1-8b-instant,llama-3.3-70b-versatile

# [gemini] Google AI Studio 가입 + Key 필요 / 일부 모델 Free Tier / OpenAI-compatible endpoint
OPENCODE_PROVIDER_GEMINI_URL=https://generativelanguage.googleapis.com/v1beta/openai/
OPENCODE_PROVIDER_GEMINI_KEY=발급받은_GEMINI_API_KEY
OPENCODE_PROVIDER_GEMINI_MODELS=gemini-2.5-flash,gemini-2.0-flash,gemini-2.0-flash-lite,gemini-2.5-pro

# [cerebras] 가입 + Key 필요 / Free Tier / OpenAI-compatible
OPENCODE_PROVIDER_CEREBRAS_URL=https://api.cerebras.ai/v1
OPENCODE_PROVIDER_CEREBRAS_KEY=발급받은_CEREBRAS_API_KEY
OPENCODE_PROVIDER_CEREBRAS_MODELS=gpt-oss-120b,llama3.1-8b,qwen-3-235b-a22b-instruct-2507,zai-glm-4.7

# [sambanova] 가입 + Key 필요 / Free Tier + 가입 크레딧 / OpenAI-compatible
OPENCODE_PROVIDER_SAMBANOVA_URL=https://api.sambanova.ai/v1
OPENCODE_PROVIDER_SAMBANOVA_KEY=발급받은_SAMBANOVA_API_KEY
OPENCODE_PROVIDER_SAMBANOVA_MODELS=Meta-Llama-3.3-70B-Instruct,gpt-oss-120b,DeepSeek-V3.1,Llama-4-Maverick-17B-128E-Instruct,DeepSeek-V3.2

# [zai] 가입 + Key 필요 / Flash 모델 Free / OpenAI-compatible
OPENCODE_PROVIDER_ZAI_URL=https://api.z.ai/api/paas/v4/
OPENCODE_PROVIDER_ZAI_KEY=발급받은_ZAI_API_KEY
OPENCODE_PROVIDER_ZAI_MODELS=GLM-4.7-Flash,GLM-4.5-Flash,GLM-4.6V-Flash

# [novita] 가입 + Key 필요 / 일부 무료 모델 / OpenAI-compatible
OPENCODE_PROVIDER_NOVITA_URL=https://api.novita.ai/openai
OPENCODE_PROVIDER_NOVITA_KEY=발급받은_NOVITA_API_KEY
OPENCODE_PROVIDER_NOVITA_MODELS=inclusionai/ling-2.6-1t

# [cloudflare] 가입 + API Token + account_id 필요 / 선택 / OpenAI-compatible
# account_id 를 실제 값으로 바꿔야 합니다.
OPENCODE_PROVIDER_CLOUDFLARE_URL=https://api.cloudflare.com/client/v4/accounts/발급받은_ACCOUNT_ID/ai/v1
OPENCODE_PROVIDER_CLOUDFLARE_KEY=발급받은_CLOUDFLARE_API_TOKEN
OPENCODE_PROVIDER_CLOUDFLARE_MODELS=@cf/meta/llama-3.1-8b-instruct,@cf/openai/gpt-oss-120b

# ----------------------------------------------------
# 2. 에이전트 인터페이스(API) 타입 설정
# 각 요청 성격에 따라 자동 핸드오버(auto) 또는 수동 개입(manual) 모드를 설정합니다.
# 형식: 인텐트명:모드 (쉼표로 구분)
OPENCODE_API_TYPES=의뢰:manual,검토:manual,검증:manual,개발:auto,default:manual

# 3. 에이전트별 모델(Agent Models) 통합 설정
# 모든 에이전트(메인 및 하위 에이전트 포함)가 사용할 모델을 지정합니다.
# 형식(권장): 에이전트명=공급자/모델명 (쉼표로 구분)
# 예전 형식인 에이전트명:공급자/모델명 도 호환되지만,
# 모델명에 ':' 가 들어갈 수 있으므로 '=' 사용을 권장합니다.
# 기본값은 OpenRouter Free 로 맞춰두었습니다.
# OpenRouter Key만 먼저 넣으면 전체 에이전트가 우선 구동됩니다.
# 추후 더 좋은 조합 예시:
# - prometheus=cerebras/gpt-oss-120b 또는 sambanova/Meta-Llama-3.3-70B-Instruct
# - sisyphus=groq/openai/gpt-oss-20b 또는 gemini/gemini-2.5-flash
# - librarian=cerebras/gpt-oss-120b 또는 groq/llama-3.3-70b-versatile
OPENCODE_AGENT_MODELS=prometheus=openrouter/openai/gpt-oss-120b:free,sisyphus=openrouter/openai/gpt-oss-120b:free,atlas=openrouter/openai/gpt-oss-120b:free,explore=openrouter/openai/gpt-oss-120b:free,librarian=openrouter/openai/gpt-oss-120b:free,coder=openrouter/openai/gpt-oss-120b:free

# ----------------------------------------------------
# 4. GitLab 연동 설정 (저장소 자동 클론)
GITLAB_HOST=https://gitlab.com
GITLAB_USERNAME=내계정아이디
GITLAB_TOKEN=발급받은PersonalAccessToken

# -------------------------
# Repository Settings
# -------------------------
# 컨테이너 내에서 저장소(Repository)가 마운트될 기본 경로입니다.
# Service 코드에서 REPOSITORY_BASE_PATH 환경변수로 사용됩니다.
REPOSITORY_BASE_PATH=/swdata/repository

# -------------------------
# GitLab Clone Settings
# -------------------------
# 기동 시점에 GitLab 저장소들을 자동으로 Clone(또는 Pull) 할지 여부를 결정합니다. 
# 설정하지 않으면 false가 기본값으로 적용되어 Clone을 건너뜁니다.
GITLAB_AUTO_CLONE=false

# 그룹별로 클론/풀 할 대상 브랜치를 지정합니다. (형식: 그룹코드:브랜치명,그룹코드:브랜치명)
# 지정하지 않은 그룹이나 설정이 없을 경우 기본적으로 'main' 브랜치가 사용됩니다.
OPENCODE_REPOSITORY_GROUP=S01:main,S02:dev

# 5. 연동할 복수 저장소 목록 (파이프(|)로 구분)
# 형식: 리포지토리Path;클론될폴더명
# 위 OPENCODE_APP_CONFIG의 앱코드(S01)가 여기의 group명과 일치해야 합니다.
REPOSITORIES=S01/project-a.git;project-a|S02/project-b.git;project-b

# ----------------------------------------------------
# 6. 동적 모델(Agent) 생성 설정
# Open WebUI 등에 노출될 모델 목록을 설정합니다.
# 형식: 앱이름:앱코드 (쉼표로 구분. 앱코드는 GitLab Group명과 매칭되며 항상 3자리여야 함)
# 예: SOLT1:S01 -> S01은 GitLab의 Group명이자 앱의 고유 코드임
OPENCODE_APP_CONFIG=SOLT1:S01,SOLT2:S02

# 지원할 에이전트 종류 (쉼표로 구분)
OPENCODE_AGENT_TYPES=의뢰,검토,개발,검증
